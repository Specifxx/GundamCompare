name: Probe candidate stores (temporary)
on:
  push:
    branches: [claude/project-thread-oscc7y]
    paths: [.github/workflows/probe-stores-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="GundamCompare store probe (contact: compareempire@gmail.com)"
          base=https://hobbytechtoys.com.au
          for p in 1 2 3; do
            curl -s -m 30 -A "$UA" "$base/collections.json?limit=250&page=$p" > /tmp/c$p.json
            echo "collections page $p: $(jq '.collections|length' /tmp/c$p.json 2>&1 | head -1)"
            jq -r '.collections[]? | select(.handle|test("gundam|gunpla|bandai|hg|mg|rg|pg";"i")) | "\(.handle) \(.products_count)"' /tmp/c$p.json | head -25
          done
          curl -s -m 30 -A "$UA" "$base/search/suggest.json?q=gundam&resources[type]=product&resources[limit]=5" | jq -r '.resources.results.products[]?|"\(.title) \(.vendor)"' | head
          curl -s -m 30 -A "$UA" "$base/products.json?limit=250&page=1" > /tmp/a.json
          echo "all-products p1: $(jq '.products|length' /tmp/a.json)"
          jq -r '[.products[]|select(.vendor|test("bandai";"i"))]|length' /tmp/a.json
