name: Probe candidate stores (temporary)
on:
  push:
    branches: [claude/project-thread-oscc7y]
    paths: [.github/workflows/probe-stores-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="GundamCompare store probe (contact: compareempire@gmail.com)"
          base=https://hobbytechtoys.com.au
          for h in gundam-hg-high-grade gundam-mg-master-grade gundam-rg-real-grade gundam-pg-perfect-grade gundam-eg-entry-grade gundam-sd-super-deformed; do
            sleep 1
            curl -s -m 30 -A "$UA" "$base/collections/$h/products.json?limit=250" > /tmp/p.json
            echo "-- $h: products=$(jq '.products|length' /tmp/p.json) item_no_sku=$(jq '[.products[].variants[]|select((.sku//"")|test("^G?[0-9]{7}$"))]|length' /tmp/p.json) jan_sku_or_barcode=$(jq '[.products[].variants[]|select(((.sku//"")+" "+(.barcode//""))|test("45[0-9]{11}"))]|length' /tmp/p.json) vendors=$(jq -r '[.products[].vendor]|unique|join(",")' /tmp/p.json | cut -c1-60)"
            jq -r '.products[0:2][]|"   \(.title) | sku=\(.variants[0].sku) | bc=\(.variants[0].barcode) | \(.variants[0].price) | avail=\(.variants[0].available)"' /tmp/p.json
          done
