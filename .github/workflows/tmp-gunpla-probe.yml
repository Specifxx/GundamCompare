# TEMPORARY (Gunpla kit import on the branch). Removed before the branch merges.
name: tmp gunpla import
on:
  push:
    branches: [claude/project-thread-hvyp1n]
    paths: [scripts/import-kits.ts, src/content/kit-stores.ts, .github/workflows/tmp-gunpla-probe.yml]
permissions:
  contents: write
jobs:
  kits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/import-kits.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/public/kits.json
          git commit -m "data: Gunpla import with the new shops (branch test)"
          git push
