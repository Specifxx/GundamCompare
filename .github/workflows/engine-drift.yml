name: Engine drift
# Gundam Compare, Lorcana Compare and YGO Compare run one engine (engine.json).
# A pull request gets a summary of what the sister repos would need; the weekly
# run fails, and GitHub emails the owner, if main still differs from a sister.
on:
  pull_request:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/engine-drift.ts ${{ github.event_name == 'pull_request' && ' ' || '--strict' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
